<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondiale 2 - Gestão Total</title>
    <style>
        :root { --primary: #e63946; --secondary: #1d3557; --bg: #f1faee; --white: #ffffff; --accent: #48c774; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); margin: 0; padding-bottom: 80px; }
        .header { background: var(--secondary); color: white; padding: 15px; text-align: center; border-bottom: 4px solid var(--primary); }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; margin-bottom: 15px; border: 2px solid var(--secondary); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 5px; border-bottom: 1px solid #eee; font-size: 14px; }
        .input-tabela { width: 100%; border: 1px solid #ddd; border-radius: 4px; padding: 10px; font-size: 16px; background: #fffde7; }
        .col-custo { color: #2b8a3e; font-weight: bold; text-align: right; }
        .painel-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--secondary); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .resumo-item { text-align: center; }
        .resumo-val { display: block; font-size: 1.1rem; font-weight: bold; color: #a2d2ff; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-save { background: var(--accent); color: white; }
        .btn-add { background: #eee; color: #333; }
        .btn-import { background: #457b9d; color: white; }
        .tabs-fixas { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--secondary); border-top: 3px solid var(--primary); }
        .tab-btn { flex: 1; padding: 15px; color: white; border: none; background: none; font-weight: bold; }
        .tab-btn.active { background: var(--primary); }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="header"><h2>MONDIALE 2</h2></div>
<div class="container" id="app"></div>

<div class="tabs-fixas">
    <button class="tab-btn active" id="btn-fichas" onclick="navegar('fichas')">FICHAS</button>
    <button class="tab-btn" id="btn-estoque" onclick="navegar('estoque')">ESTOQUE</button>
    <button class="tab-btn" id="btn-backup" onclick="navegar('backup')">BACKUP</button>
</div>

<datalist id="lista-insumos"></datalist>

<script>
const saboresFull = ["Mussarela", "Pizza de Calabresa", "Pizza de Calabresa 2", "P.de Calabresa 3", "P.de Calabresa 4", "Presunto 1", "Presunto 2", "Presunto 3", "Catumilho", "Marguerita", "Dois Queijo", "Roma", "Atum 1", "Poderosa 1", "Poderosa 2", "Poderosa 3", "Baiana", "Bacon 1", "Bauru", "Francesa", "Suprema", "Mesclada", "Gramuth", "Lombo 1", "Lombo 2", "Lombo 3", "Lombo Nobre", "Brocolis 1", "Brocolis Super", "Brocolis Especial", "Frango 1", "Calafrango", "Crocante", "Mimosa", "Caipira", "Do Chefe", "Frangao", "Monte Neve", "Paulista", "Toscana", "Mexicana", "Calabresa Super", "Santista", "Santista 2", "Santista 3", "Kabulosa", "Mineira", "Capricho", "Champinon", "Tres Queijo", "Bacon Especial", "Escarola Especial", "Escarola Super", "Extrovertida", "Peperoni", "Portuguesa", "Quatro Queijo", "Gostosa", "Siciliana", "Tomate Seco", "Gratinada", "Jorge Tadeu", "Cinco Queijo", "Frango Super", "Palminto Especial", "Palminto Super", "Anova Mondialle", "Portuguesa Especial", "Portuguesa Super", "Light", "Amoda da Casa", "Carne Seca 1", "Carne Seca Especial", "Carne Seca Super", "Carne Seca Maluca", "Frango Super 2", "Frango Super 3", "Amoda do Cliente", "Seis Queijo", "Brigadeiro", "Confete", "Romeu e Julieta", "Banana 1", "Banana 2", "Banana 3", "Banana Nevada", "Chocolate com Uva"];

const DB_KEY = 'mondiale_v17_final';
const CUSTO_FIXO = 3.20;

let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
    precos: {"Farinha": { preco: 25, emb: 5000 }},
    pizzas: {"MASSA BASE": []},
    rendimentoMassa: 20,
    atual: "MASSA BASE"
};

saboresFull.forEach(s => { if(!db.pizzas[s]) db.pizzas[s] = []; });

function navegar(pag) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + pag).classList.add('active');
    if(pag === 'fichas') renderFichas();
    else if(pag === 'estoque') renderEstoque();
    else renderBackup();
}

function calcularUnidadeMassa() {
    let custoTotalMassa = 0;
    db.pizzas["MASSA BASE"].forEach(i => {
        let info = db.precos[i.item] || { preco: 0, emb: 1 };
        custoTotalMassa += (info.preco / info.emb) * i.peso;
    });
    return custoTotalMassa / (db.rendimentoMassa || 1);
}

function renderFichas() {
    let nome = db.atual;
    let itens = db.pizzas[nome] || [];
    let custoMassaBolha = calcularUnidadeMassa();
    
    let html = `
        <div class="card">
            <select onchange="db.atual=this.value; renderFichas()">
                <option value="MASSA BASE" ${nome==='MASSA BASE'?'selected':''}>🍞 CONFIGURAR MASSA BASE</option>
                ${saboresFull.map(s => `<option value="${s}" ${s===nome?'selected':''}>${s.toUpperCase()}</option>`).join('')}
            </select>
            <div class="painel-resumo">
                <div class="resumo-item">${nome==='MASSA BASE'?'RENDIMENTO':'VALOR DA MASSA'}<span class="resumo-val">${nome==='MASSA BASE' ? db.rendimentoMassa + ' un' : 'R$ ' + custoMassaBolha.toFixed(2)}</span></div>
                <div class="resumo-item">CUSTO TOTAL<span class="resumo-val" id="display-total" style="color:#48c774">R$ 0,00</span></div>
            </div>
            <table>
                <thead><tr><th>Ingrediente</th><th style="width:100px">Qtd (g/un)</th><th style="width:80px">R$</th></tr></thead>
                <tbody id="tabela-corpo">`;

    itens.forEach((i, idx) => {
        let info = db.precos[i.item] || { preco: 0, emb: 1 };
        let valor = (info.preco / info.emb) * i.peso;
        html += `<tr>
            <td><input class="input-tabela" list="lista-insumos" value="${i.item}" onchange="updateItem(${idx}, 'item', this.value)"></td>
            <td><input class="input-tabela" type="number" value="${i.peso}" oninput="updateItemLive(${idx}, this.value)"></td>
            <td class="col-custo" id="custo-${idx}">R$ ${valor.toFixed(2)}</td>
        </tr>`;
    });

    html += `</tbody></table>
        ${nome === 'MASSA BASE' ? `<div style="margin-top:15px">Quantas pizzas essa receita rende? <input type="number" class="input-tabela" value="${db.rendimentoMassa}" oninput="db.rendimentoMassa=this.value; recalcularTudo()"></div>` : ''}
        <button class="btn btn-add" onclick="addLinha()">+ Ingrediente</button>
        <button class="btn btn-save" onclick="salvar()">SALVAR FICHA</button>
    </div>`;

    document.getElementById('app').innerHTML = html;
    recalcularTudo();
    atualizarDatalist();
}

function updateItemLive(idx, valor) {
    let peso = parseFloat(valor) || 0;
    db.pizzas[db.atual][idx].peso = peso;
    let info = db.precos[db.pizzas[db.atual][idx].item] || { preco: 0, emb: 1 };
    document.getElementById(`custo-${idx}`).textContent = "R$ " + ((info.preco / info.emb) * peso).toFixed(2);
    recalcularTudo();
}

function updateItem(idx, campo, valor) {
    db.pizzas[db.atual][idx][campo] = valor;
    renderFichas();
}

function recalcularTudo() {
    let soma = 0;
    db.pizzas[db.atual].forEach(i => {
        let info = db.precos[i.item] || { preco: 0, emb: 1 };
        soma += (info.preco / info.emb) * i.peso;
    });
    let final = db.atual === "MASSA BASE" ? soma : (soma + calcularUnidadeMassa() + CUSTO_FIXO);
    document.getElementById('display-total').textContent = "R$ " + final.toFixed(2);
}

function renderEstoque() {
    let html = `<div class="card"><h3>Estoque e Preços</h3><table><thead><tr><th>Item</th><th>Preço R$</th><th>Emb(g)</th></tr></thead><tbody>`;
    for(let n in db.precos) {
        html += `<tr>
            <td><input class="input-tabela" value="${n}" onchange="editEstoque('${n}', 'nome', this.value)"></td>
            <td><input class="input-tabela" type="number" value="${db.precos[n].preco}" onchange="editEstoque('${n}', 'preco', this.value)"></td>
            <td><input class="input-tabela" type="number" value="${db.precos[n].emb}" onchange="editEstoque('${n}', 'emb', this.value)"></td>
        </tr>`;
    }
    html += `</tbody></table><button class="btn btn-add" onclick="addEstoque()">+ Novo Insumo</button><button class="btn btn-save" onclick="salvar()">SALVAR ESTOQUE</button></div>`;
    document.getElementById('app').innerHTML = html;
}

function editEstoque(n, c, v) {
    if(c === 'nome') { db.precos[v] = db.precos[n]; delete db.precos[n]; }
    else db.precos[n][c] = parseFloat(v) || 0;
}

function addLinha() { db.pizzas[db.atual].push({item: "", peso: 0}); renderFichas(); }
function addEstoque() { db.precos["Novo"] = { preco: 0, emb: 1000 }; renderEstoque(); }
function salvar() { localStorage.setItem(DB_KEY, JSON.stringify(db)); alert("Salvo no navegador!"); }
function atualizarDatalist() { document.getElementById('lista-insumos').innerHTML = Object.keys(db.precos).map(i => `<option value="${i}">`).join(''); }

function renderBackup() {
    document.getElementById('app').innerHTML = `
        <div class="card">
            <h3>Backup Mondiale 2</h3>
            <p style="font-size:13px; color:#666">Sempre baixe um backup após mudar preços ou receitas importantes.</p>
            <button class="btn btn-save" onclick="exportar()">BAIXAR ARQUIVO DE BACKUP</button>
            <hr style="margin:20px 0; border:0; border-top:1px solid #eee">
            <p style="font-size:13px; color:#666">Para recuperar dados, selecione o arquivo baixado anteriormente:</p>
            <button class="btn btn-import" onclick="document.getElementById('file-input').click()">IMPORTAR / RECUPERAR BACKUP</button>
            <input type="file" id="file-input" accept=".json" onchange="importar(event)">
        </div>`;
}

function exportar() {
    const blob = new Blob([JSON.stringify(db)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `backup_mondiale_${new Date().toLocaleDateString()}.json`; a.click();
}

function importar(event) {
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            db = JSON.parse(e.target.result);
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            alert("Backup recuperado com sucesso!");
            navegar('fichas');
        } catch(err) { alert("Erro ao ler o arquivo!"); }
    };
    reader.readAsText(event.target.files[0]);
}

navegar('fichas');
</script>
</body>
</html>
